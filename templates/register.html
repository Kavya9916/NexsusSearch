<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NexusSearch – Register</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Rajdhani:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--pri:#ff6a00;--sec:#cc2200;--bg:#0a0500;--border:rgba(255,106,0,0.22);--text:#f5e6d8;--muted:#8a6a50}
body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;overflow:hidden;display:flex;align-items:center;justify-content:center}
.grid{position:fixed;inset:0;z-index:0;background-image:linear-gradient(rgba(255,106,0,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,106,0,0.05) 1px,transparent 1px);background-size:60px 60px;animation:gm 20s linear infinite}
@keyframes gm{from{transform:translateY(0)}to{transform:translateY(60px)}}
.orb{position:fixed;border-radius:50%;filter:blur(100px);z-index:0}
.o1{width:500px;height:500px;background:rgba(204,34,0,0.1);top:-200px;right:-150px}
.o2{width:400px;height:400px;background:rgba(255,106,0,0.07);bottom:-100px;left:-100px}
.page{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;width:100vw;min-height:100vh;padding:20px}
.card{background:rgba(255,106,0,0.03);border:1px solid var(--border);border-radius:24px;padding:50px;width:100%;max-width:480px;backdrop-filter:blur(20px);box-shadow:0 0 60px rgba(255,106,0,0.08),0 25px 50px rgba(0,0,0,0.6);animation:su .5s ease}
@keyframes su{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:30px}
.brand-icon{width:44px;height:44px;background:linear-gradient(135deg,var(--pri),var(--sec));border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 0 20px rgba(255,106,0,0.4)}
.brand-name{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;color:var(--pri);letter-spacing:2px}
.form-title{font-family:'Orbitron',monospace;font-size:22px;font-weight:600;color:var(--text);margin-bottom:6px}
.form-sub{color:var(--muted);font-size:13px;margin-bottom:28px}
.form-sub a{color:var(--pri);text-decoration:none}
.alert{padding:12px 16px;border-radius:10px;margin-bottom:20px;font-size:13px;border:1px solid;background:rgba(204,34,0,0.12);border-color:rgba(204,34,0,0.35);color:#ffaa88;animation:fi .3s ease}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.fg{margin-bottom:18px}
.fl{display:block;font-size:11px;font-weight:600;color:#a07858;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
.fi{width:100%;background:rgba(255,106,0,0.05);border:1px solid rgba(255,106,0,0.15);border-radius:10px;padding:12px 16px;color:var(--text);font-size:14px;font-family:'Inter',sans-serif;transition:all .3s;outline:none}
.fi:focus{border-color:var(--pri);background:rgba(255,106,0,0.08);box-shadow:0 0 0 3px rgba(255,106,0,0.12)}
.fi::placeholder{color:var(--muted)}
.sbar{height:3px;border-radius:2px;background:rgba(255,106,0,0.1);margin-top:8px;overflow:hidden}
.sfill{height:100%;border-radius:2px;width:0%;transition:all .3s}
.shint{font-size:11px;color:var(--muted);margin-top:5px}
.btn-reg{width:100%;padding:13px;background:linear-gradient(135deg,var(--sec),var(--pri));border:none;border-radius:10px;color:#fff;font-size:14px;font-weight:600;font-family:'Rajdhani',sans-serif;letter-spacing:1px;cursor:pointer;transition:all .3s;margin-top:8px}
.btn-reg:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(204,34,0,0.4)}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0}
.dl{flex:1;height:1px;background:rgba(255,106,0,0.1)}
.dt{color:var(--muted);font-size:11px}
.ll{text-align:center;font-size:13px;color:var(--muted)}
.ll a{color:var(--pri);text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="grid"></div><div class="orb o1"></div><div class="orb o2"></div>
<div class="page">
  <div class="card">
    <div class="brand"><div class="brand-icon">🔥</div><div class="brand-name">NEXUSSEARCH</div></div>
    <div class="form-title">Create Account</div>
    <div class="form-sub">Already registered? <a href="/">Sign in →</a></div>
    {% if error %}<div class="alert">⚠️ {{ error }}</div>{% endif %}
    <form method="POST" action="/register">
      <div class="fg"><label class="fl">Full Name</label><input type="text" name="name" id="name" pattern="[A-Za-z ]{3,50}" title="Name must be letters only, minimum 3 characters" requiredoninput="validateName(this)">
<small id="nameError" style="color:red;display:none">
  ❌ Name must contain letters only (min 3 characters)
</small></div>
      <div class="fg"><label class="fl">Email Address</label><input type="email" name="email" class="fi" placeholder="you@example.com" required></div>
      <div class="fg">
        <label class="fl">Password</label>
        <input type="password" name="password" id="pw" class="fi" placeholder="Min. 6 characters" required oninput="chk(this.value)">
        <div class="sbar"><div class="sfill" id="sf"></div></div>
        <div class="shint" id="st">Enter a password</div>
      </div>
      <button type="submit" class="btn-reg">🚀 CREATE MY ACCOUNT</button>
    </form>
    <div class="divider"><div class="dl"></div><div class="dt">or</div><div class="dl"></div></div>
    <div class="ll">Already have an account? <a href="/">Login Here</a></div>
  </div>
</div>
<script>
function chk(p){
  const sf=document.getElementById('sf'),st=document.getElementById('st');
  let s=0;
  if(p.length>=6)s++;if(p.length>=10)s++;if(/[A-Z]/.test(p))s++;if(/[0-9]/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;
  const L=[{w:'0%',c:'transparent',t:'Enter a password'},{w:'20%',c:'#cc2200',t:'Very Weak'},{w:'40%',c:'#ff4400',t:'Weak'},{w:'60%',c:'#ff8800',t:'Fair'},{w:'80%',c:'#ff9c40',t:'Strong'},{w:'100%',c:'#ff6a00',t:'🔥 Very Strong'}];
  const l=L[Math.min(s,5)];
  sf.style.width=l.w;sf.style.background=l.c;st.textContent=l.t;st.style.color=l.c;
}
function validateName(input) {
  const val = input.value.trim();
  const err = document.getElementById('nameError');
  const regex = /^[A-Za-z ]{3,50}$/;

  if (!regex.test(val)) {
    err.style.display = 'block';
    input.style.borderColor = 'red';
  } else {
    err.style.display = 'none';
    input.style.borderColor = 'green';
  }
}
</script>
</body>
</html>
